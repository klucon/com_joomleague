MOD_JOOMLEAGUE_STANDINGS_EMPTY="Tabela tego projektu nie została jeszcze opublikowana."
MOD_JOOMLEAGUE_STANDINGS_UNAVAILABLE="Tabela nie jest dostępna dla tego projektu."
MOD_JOOMLEAGUE_STANDINGS_SCOPE_LABEL="Zakres tabeli"
MOD_JOOMLEAGUE_STANDINGS_SCOPE_DESC="Wybierz zakres zdefiniowany w profilu sportowym. Po zmianie projektu zapisz ustawienia, aby ponownie wczytać jego zakresy. Dziedziczenie używa domyślnego zakresu profilu."
MOD_JOOMLEAGUE_STANDINGS_OFFSET_LABEL="Przesunięcie wierszy"
MOD_JOOMLEAGUE_STANDINGS_OFFSET_DESC="Pomiń podaną liczbę wierszy. Przesunięcie inne niż zero ma pierwszeństwo przed wyśrodkowaniem na wyróżnionym zgłoszeniu."
