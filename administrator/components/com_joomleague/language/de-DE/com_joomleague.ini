COM_JOOMLEAGUE_FES_RANKING_PARAM_DESCR_DISPLAY_COLUMNS="Verwenden Sie folgende Kürzel, durch Komma getrennt:<br/> PLAYED – gespielte Spiele<br/> WINS – Siege<br/> LOSSES – Niederlagen<br/> TIES – Unentschieden<br/> WOT – Siege nach Verlängerung<br/> WSO – Siege nach Penaltyschießen<br/> LOT – Niederlagen nach Verlängerung<br/> LSO – Niederlagen nach Penaltyschießen<br/> SCOREFOR – erzielte Tore/Punkte<br/> SCOREAGAINST – erhaltene Tore/Punkte<br/> SCOREPCT – Trefferquote (erzielt/erhalten × 100)<br/> RESULTS – Ergebnis als erzielt:erhalten<br/> DIFF – Tordifferenz (erzielt minus erhalten)<br/> POINTS – Gesamtpunkte (inkl. Startpunkte)<br/> BONUS – Bonus-/Strafpunkte<br/> START – Startpunkte des Teams<br/> LEGS – Sätze/Legs als gewonnen:verloren<br/> LEGS_DIFF – Satz-/Legdifferenz<br/> GB – Rückstand auf den Tabellenführer (Games Back)<br/> LEGS_RATIO – Verhältnis gewonnener zu verlorenen Sätzen/Legs<br/> WINPCT – Siegquote<br/> QUOT – Punkte pro Spiel (ohne Startpunkte)<br/> NEGPOINTS – Verlustpunkte (negative Punkte)<br/> OLDNEGPOINTS – Punkte als erzielt:verloren (ältere Darstellung)<br/> POINTS_RATIO – Verhältnis von Punkten zu Verlustpunkten<br/>TADMIN – Benutzername des Team-Administrators<br/>GFA – durchschnittlich erzielte Tore pro Spiel<br/>GAA – durchschnittlich erhaltene Tore pro Spiel<br/>PPG – Punkte pro Spiel im Schnitt (ohne Startpunkte)<br/>PPP – prozentualer Anteil der erreichten an den maximal möglichen Punkten<br/>LASTGAMES – Form der letzten Spiele (Sieg/Unentschieden/Niederlage-Symbole)<br/>"
