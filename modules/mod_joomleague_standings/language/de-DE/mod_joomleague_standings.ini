MOD_JOOMLEAGUE_STANDINGS_LINK_ENTRY_LABEL="Teilnehmernamen verlinken"
MOD_JOOMLEAGUE_STANDINGS_SHOW_EMPTY_LABEL="Hinweis bei fehlenden Daten anzeigen"
MOD_JOOMLEAGUE_STANDINGS_SHOW_IMAGES_LABEL="Teilnehmerbilder anzeigen"
