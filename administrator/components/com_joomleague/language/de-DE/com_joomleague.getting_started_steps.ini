COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_TITLE="Systemübersicht"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_DESCRIPTION="Die Übersicht zeigt den aktuellen Inhaltsumfang. Eine neue Installation enthält die mitgelieferten Sportprofile, während noch keine Wettbewerbsdaten vorhanden sind."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_TITLE="Mit einem Sportprofil beginnen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_DESCRIPTION="Sportprofile definieren Regeln, Positionen, Ereignisse, Statistiken und das Wertungsmodell. Erstellen Sie eine Sportart aus dem gewünschten Profil."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_TITLE="Wettbewerb festlegen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_DESCRIPTION="Wettbewerbe bilden die dauerhafte Identität einer Liga, eines Pokals, Turniers, Rennens oder anderen Wettkampfs über mehrere Saisons hinweg."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_TITLE="Projekt aufbauen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_DESCRIPTION="Ein Projekt ist die konkrete Austragung eines Wettbewerbs in einer Saison. Hier werden Phasen, Teilnehmer, Terminpläne und Ergebnisse verwaltet."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_TITLE="Darstellung festlegen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_DESCRIPTION="Globale Profilvorlagen stellen sportspezifische Standardwerte bereit. Projektvorlagen können diese für ein einzelnes Projekt überschreiben, ohne die Profilgrundlage zu ändern."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_TITLE="Werkzeuge und Datenoperationen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_DESCRIPTION="Die Werkzeuge umfassen Datenbankexporte, SQL-Import, Sprachverwaltung und weitere kontrollierte Wartungsfunktionen. Sie können diese Tour jederzeit über das Menü für geführte Touren neu starten."
