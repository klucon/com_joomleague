MOD_JOOMLEAGUE_STANDINGS="JoomLeague - Tabelle"
MOD_JOOMLEAGUE_STANDINGS_XML_DESCRIPTION="Zeigt die aktuelle Tabelle eines JoomLeague-Projekts an."
MOD_JOOMLEAGUE_STANDINGS_PROJECT_LABEL="Projekt"
MOD_JOOMLEAGUE_STANDINGS_PROJECT_DESC="Das JoomLeague-Projekt, dessen Tabelle angezeigt werden soll."
MOD_JOOMLEAGUE_STANDINGS_STAGE_LABEL="Phasen-ID"
MOD_JOOMLEAGUE_STANDINGS_STAGE_DESC="Beschränkt die Tabelle auf eine einzelne Phase. Mit 0 wird die Tabelle für das gesamte Projekt angezeigt."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_LABEL="Teilnehmer hervorheben"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_DESC="Hebt die Zeile dieser Mannschaft bzw. dieses Teilnehmers optisch hervor. Die Liste enthält nur Teilnehmer des oben ausgewählten Projekts. Wählen und speichern Sie zuerst das Projekt. Bei einer Zeilenbegrenzung wird der angezeigte Ausschnitt um diesen Teilnehmer zentriert, statt immer bei Platz 1 zu beginnen."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_NONE="— Keine —"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_LABEL="Art der Hervorhebung"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_DESC="Legt die Darstellung der hervorgehobenen Teilnehmerzeile fest. Die Zentrierung bei einer Zeilenbegrenzung bleibt unabhängig davon bestehen. Diese Einstellung ändert nur die optische Darstellung."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_ROW="Ganze Zeile"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_TEXT="Nur Fettdruck"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_NONE="Keine"
MOD_JOOMLEAGUE_STANDINGS_INHERIT="Projektvorlage verwenden"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_LABEL="Ergebnisspalten anzeigen"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_DESC="Übernimmt die Einstellung der Tabellenvorlage oder legt die Anzeige der Ergebnisspalten für diese Modulinstanz gesondert fest."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_LABEL="Ergebnisdifferenz anzeigen"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_DESC="Übernimmt die Einstellung der Tabellenvorlage oder legt die Anzeige der Differenzspalten für diese Modulinstanz gesondert fest."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_LABEL="Satzspalten anzeigen"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_DESC="Übernimmt die Einstellung der Tabellenvorlage oder legt die Anzeige der Satzspalten für diese Modulinstanz gesondert fest."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_LABEL="Punktespalten anzeigen"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_DESC="Übernimmt die Einstellung der Tabellenvorlage oder legt die Anzeige der Punktespalten für diese Modulinstanz gesondert fest."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_LABEL="Hervorhebungsfarbe (Zeile)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_DESC="Hintergrundfarbe der hervorgehobenen Zeile. Wird nur bei der Hervorhebung der ganzen Zeile verwendet. Mit der nachfolgenden Textfarbe lässt sich zusätzlich die Schriftfarbe festlegen."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_LABEL="Hervorhebungsfarbe (Text)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_DESC="Textfarbe der hervorgehobenen Zeile. Wird bei beiden Hervorhebungsarten verwendet. Bei der Hervorhebung der ganzen Zeile kann zusätzlich die Hintergrundfarbe festgelegt werden."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_BOLD_LABEL="Fett"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_ITALIC_LABEL="Kursiv"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_UNDERLINE_LABEL="Unterstrichen"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_LABEL="Zeilenbegrenzung"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_DESC="Maximale Anzahl der angezeigten Zeilen. Mit 0 werden alle Zeilen angezeigt. Ist oben ein Teilnehmer zur Hervorhebung ausgewählt, wird der Ausschnitt um diesen zentriert, statt bei Platz 1 zu beginnen."
MOD_JOOMLEAGUE_STANDINGS_METRICS_LABEL="Sichtbare Spalten"
MOD_JOOMLEAGUE_STANDINGS_METRICS_DESC="Wählen Sie die anzuzeigenden Spalten aus. Die Liste enthält nur die Kennzahlen des oben ausgewählten Projekts. Wählen und speichern Sie zuerst das Projekt. Ohne Auswahl werden alle Spalten angezeigt."
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_LABEL="Zusammengefasstes Ergebnisformat"
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_DESC="Zeigt zusammengehörige Werte für und gegen einen Teilnehmer, etwa Ergebnisse, Legs, Sätze oder Maps, in einer gemeinsamen Spalte im Format 'xx:xx' statt in zwei getrennten Spalten an."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_LABEL="Abgekürzte Spaltenüberschriften"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_DESC="Verwendet abgekürzte Spaltenüberschriften, etwa Sp/S/U/N, sofern eine Kurzform definiert ist. Spalten ohne Kurzform behalten ihre vollständige Überschrift."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_LABEL="Hinweise zu abgekürzten Überschriften"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_DESC="Zeigt beim Überfahren einer abgekürzten Überschrift mit der Maus den vollständigen Spaltennamen an, damit Abkürzungen wie Sp/S/U/N verständlich bleiben."
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_LABEL="Responsive Spalten"
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_DESC="Blendet auf schmalen Bildschirmen alle Spalten außer Platz, Teilnehmer und der letzten sichtbaren Spalte aus, statt die Tabelle bis zum horizontalen Scrollen zu verkleinern."
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_LABEL="Projektname anzeigen"
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_DESC="Zeigt den Projektnamen als Überschrift über der Tabelle an."
MOD_JOOMLEAGUE_STANDINGS_ZONES_FIELDSET_LABEL="Zonenbegrenzungen"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_LABEL="Obere Zone markieren"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_DESC="Zeichnet eine farbige Linie unter der letzten Zeile der oberen Zone, beispielsweise den Aufstiegsplätzen."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_LABEL="Größe der oberen Zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_DESC="Anzahl der Zeilen ab Platz 1, die zur oberen Zone gehören."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_LABEL="Linienfarbe der oberen Zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_DESC="Farbe der Linie am unteren Rand der oberen Zone."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_LABEL="Untere Zone markieren"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_DESC="Zeichnet eine farbige Linie über der ersten Zeile der unteren Zone, beispielsweise den Abstiegsplätzen."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_LABEL="Größe der unteren Zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_DESC="Anzahl der Zeilen vom letzten Platz aus, die zur unteren Zone gehören."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_LABEL="Linienfarbe der unteren Zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_DESC="Farbe der Linie am oberen Rand der unteren Zone."
MOD_JOOMLEAGUE_STANDINGS_FORM_FIELDSET_LABEL="Aktuelle Form"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_LABEL="Aktuelle Form anzeigen"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_DESC="Ergänzt eine Spalte mit den letzten Ergebnissen jedes Teilnehmers als farbige Buchstaben (S/U/N). Das neueste Ergebnis steht rechts. Funktioniert nur bei direkten Begegnungen zwischen zwei Teilnehmern."
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_LABEL="Anzahl der Ergebnisse"
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_DESC="Anzahl der letzten Ergebnisse, die pro Teilnehmer angezeigt werden."
MOD_JOOMLEAGUE_STANDINGS_COLUMN_RANK="#"
