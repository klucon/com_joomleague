name: Build Joomla package

on:
  pull_request:
    paths:
      - "administrator/**"
      - "components/**"
      - "images/**"
      - "language/**"
      - "media/**"
      - "modules/**"
      - "plugins/**"
      - "build/**"
      - "CHANGELOG.md"
      - "README.md"
      - "pkg_joomleague.xml"
      - "pkg_script.php"
      - "script.php"
  push:
    branches:
      - main
    paths:
      - "administrator/**"
      - "components/**"
      - "images/**"
      - "language/**"
      - "media/**"
      - "modules/**"
      - "plugins/**"
      - "build/**"
      - "CHANGELOG.md"
      - "README.md"
      - "pkg_joomleague.xml"
      - "pkg_script.php"
      - "script.php"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check package build script
        run: test -f build/package.py

      - name: Validate version metadata
        run: python3 build/validate_versions.py

      - name: Build package
        run: python3 build/package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: joomleague-package
          path: dist/pkg_joomleague-*.zip
          if-no-files-found: error
