; Polish translation. Untranslated entries are omitted.
MOD_JOOMLEAGUE_STANDINGS="JoomLeague – Tabela"
MOD_JOOMLEAGUE_STANDINGS_XML_DESCRIPTION="Wyświetla aktualną tabelę projektu JoomLeague."
MOD_JOOMLEAGUE_STANDINGS_PROJECT_LABEL="Projekt"
MOD_JOOMLEAGUE_STANDINGS_PROJECT_DESC="Projekt JoomLeague, którego tabela ma być wyświetlana."
MOD_JOOMLEAGUE_STANDINGS_STAGE_LABEL="Identyfikator etapu"
MOD_JOOMLEAGUE_STANDINGS_STAGE_DESC="Ogranicz tabelę do jednego etapu. Pozostaw 0, aby wyświetlić tabelę całego projektu."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_LABEL="Wyróżnij uczestnika"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_DESC="Wyróżnij wizualnie wiersz tej drużyny lub tego zgłoszenia. Lista pokazuje tylko zgłoszenia z projektu wybranego powyżej — najpierw wybierz i zapisz projekt. Przy ustawionym limicie wierszy wyświetlany zakres jest wyśrodkowany na tym zgłoszeniu, zamiast zawsze zaczynać się od pierwszego miejsca."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_NONE="— Brak —"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_LABEL="Styl wyróżnienia"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_DESC="Sposób prezentacji wiersza wyróżnionego zgłoszenia. Wyśrodkowanie zakresu wynikające z limitu wierszy działa niezależnie od tego ustawienia — zmienia ono tylko wygląd."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_ROW="Cały wiersz"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_TEXT="Tylko pogrubiony tekst"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_NONE="Brak"
MOD_JOOMLEAGUE_STANDINGS_INHERIT="Użyj szablonu projektu"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_LABEL="Pokaż kolumny punktacji"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_DESC="Odziedzicz ustawienie szablonu tabeli lub zastąp ustawienie kolumn punktacji dla tej instancji modułu."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_LABEL="Pokaż różnicę punktacji"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_DESC="Odziedzicz ustawienie szablonu tabeli lub zastąp ustawienie kolumn różnicy punktacji dla tej instancji modułu."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_LABEL="Pokaż kolumny setów"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_DESC="Odziedzicz ustawienie szablonu tabeli lub zastąp ustawienie kolumn setów dla tej instancji modułu."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_LABEL="Pokaż kolumny punktów"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_DESC="Odziedzicz ustawienie szablonu tabeli lub zastąp ustawienie kolumn punktów dla tej instancji modułu."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_LABEL="Kolor wyróżnienia (wiersz)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_DESC="Kolor tła wyróżnionego wiersza. Używany tylko ze stylem „Cały wiersz” — połącz go z poniższym ustawieniem „Kolor wyróżnienia (tekst)”, aby określić również kolor tekstu."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_LABEL="Kolor wyróżnienia (tekst)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_DESC="Kolor tekstu wyróżnionego wiersza. Używany z każdym stylem wyróżnienia — przy stylu „Cały wiersz” połącz go z powyższym ustawieniem „Kolor wyróżnienia (wiersz)”."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_BOLD_LABEL="Pogrubienie"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_ITALIC_LABEL="Kursywa"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_UNDERLINE_LABEL="Podkreślenie"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_LABEL="Limit wierszy"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_DESC="Maksymalna liczba wyświetlanych wierszy. 0 wyświetla wszystkie wiersze. Jeśli powyżej ustawiono wyróżnione zgłoszenie, zakres jest na nim wyśrodkowany, zamiast zaczynać się od pierwszego miejsca."
MOD_JOOMLEAGUE_STANDINGS_METRICS_LABEL="Widoczne kolumny"
MOD_JOOMLEAGUE_STANDINGS_METRICS_DESC="Wybierz wyświetlane kolumny. Lista pokazuje tylko wskaźniki zdefiniowane przez projekt wybrany powyżej — najpierw wybierz i zapisz projekt. Nie zaznaczaj niczego, aby wyświetlić wszystkie kolumny."
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_LABEL="Łączny format punktacji"
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_DESC="Wyświetl sparowane kolumny zdobyte/stracone (np. punktację, legi, sety lub mapy) jako jedną kolumnę 'xx:xx' zamiast dwóch oddzielnych."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_LABEL="Skrócone etykiety kolumn"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_DESC="Używaj skróconych nagłówków kolumn (M/Z/R/P/P+/P-/+/-) zamiast pełnych nazw tam, gdzie zdefiniowano skrót. Kolumny bez skrótu zachowują pełną etykietę."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_LABEL="Podpowiedzi skróconych etykiet"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_DESC="Pokaż pełną nazwę kolumny jako podpowiedź po najechaniu na skrócony nagłówek, aby odwiedzający rozumieli skróty takie jak M/Z/R/P/P+/P-/+/-."
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_LABEL="Responsywne kolumny"
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_DESC="Na wąskich ekranach ukryj wszystkie kolumny poza miejscem, zgłoszeniem i ostatnią widoczną kolumną, zamiast zmniejszać tabelę aż do pojawienia się przewijania."
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_LABEL="Pokaż nazwę projektu"
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_DESC="Pokaż nazwę projektu jako nagłówek nad tabelą."
MOD_JOOMLEAGUE_STANDINGS_ZONES_FIELDSET_LABEL="Linie stref"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_LABEL="Oznacz górną strefę"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_DESC="Rysuje kolorową linię pod ostatnim wierszem górnej strefy (np. miejsc premiowanych awansem)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_LABEL="Rozmiar górnej strefy"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_DESC="Liczba wierszy należących do górnej strefy, licząc od pierwszego miejsca."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_LABEL="Kolor linii górnej strefy"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_DESC="Kolor linii wyznaczającej dolną granicę górnej strefy."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_LABEL="Oznacz dolną strefę"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_DESC="Rysuje kolorową linię nad pierwszym wierszem dolnej strefy (np. miejsc oznaczających spadek)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_LABEL="Rozmiar dolnej strefy"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_DESC="Liczba wierszy należących do dolnej strefy, licząc od ostatniego miejsca."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_LABEL="Kolor linii dolnej strefy"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_DESC="Kolor linii wyznaczającej górną granicę dolnej strefy."
MOD_JOOMLEAGUE_STANDINGS_FORM_FIELDSET_LABEL="Ostatnia forma"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_LABEL="Pokaż ostatnią formę"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_DESC="Dodaje kolumnę pokazującą ostatnie wyniki każdego zgłoszenia jako kolorowe litery (Z/R/P), z najnowszym wynikiem po prawej. Działa tylko dla spotkań dwóch uczestników (bezpośrednia rywalizacja)."
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_LABEL="Liczba wyników"
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_DESC="Liczba ostatnich wyników wyświetlanych dla każdego zgłoszenia."
