COM_JOOMLEAGUE_FES_RANKING_PARAM_DESCR_DISPLAY_COLUMNS="Use followings codes, separated with comma:<br/> PLAYED – matches played<br/> WINS – wins<br/> LOSSES – losses<br/> TIES – draws<br/> WOT – wins in overtime<br/> WSO – wins in a shootout<br/> LOT – losses in overtime<br/> LSO – losses in a shootout<br/> SCOREFOR – goals/points scored<br/> SCOREAGAINST – goals/points conceded<br/> SCOREPCT – scoring percentage (scored/conceded × 100)<br/> RESULTS – score shown as for:against<br/> DIFF – goal/score difference (for minus against)<br/> POINTS – total points (including start points)<br/> BONUS – bonus/penalty points<br/> START – team's start points<br/> LEGS – legs/sets shown as won:lost<br/> LEGS_DIFF – leg/set difference<br/> GB – games back from the league leader<br/> LEGS_RATIO – ratio of legs/sets won to lost<br/> WINPCT – win percentage<br/> QUOT – points per match (excluding start points)<br/> NEGPOINTS – negative ('losing') points<br/> OLDNEGPOINTS – points shown as earned:losing (legacy display)<br/> POINTS_RATIO – ratio of points to negative points<br/>TADMIN – username of the team's administrator<br/>GFA – average goals scored per match<br/>GAA – average goals conceded per match<br/>PPG – average points per match (excluding start points)<br/>PPP – percentage of maximum possible points achieved<br/>LASTGAMES – recent form (win/draw/loss icons for previous matches)<br/>"
