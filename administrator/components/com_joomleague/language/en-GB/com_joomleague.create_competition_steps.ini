COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_TITLE="Before you begin"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_DESCRIPTION="The tour will save four connected records. Prepare a competition name, season name and a short unique code for the sport type. The resulting project remains a draft until you add participants and its operational structure."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_TITLE="Create the sport type"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_DESCRIPTION="First create the runtime sport type that binds the competition to one immutable sport profile version."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_TITLE="Sport type name"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_DESCRIPTION="Enter the name administrators will use, for example Football or Senior football."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_TITLE="Sport type code"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_DESCRIPTION="Enter a short unique machine code using lowercase letters, numbers, hyphens or underscores."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_TITLE="Sport profile"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_DESCRIPTION="Select the bundled profile version that defines rules, positions, events, statistics and scoring."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_TITLE="Save the sport type"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_DESCRIPTION="Save the sport type. The enabled initialization switches also create the selected default profile definitions."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_TITLE="Create the competition"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_DESCRIPTION="Now define the stable competition identity that can be reused in multiple seasons."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_TITLE="Competition name"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_DESCRIPTION="Enter the public competition name, for example Regional League Group B."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_TITLE="Save the competition"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_DESCRIPTION="Save the published competition and continue with its season."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_TITLE="Create the season"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_DESCRIPTION="A season groups one or more competition projects into a common period. Exact start and end dates are not required."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_TITLE="Season name"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_DESCRIPTION="Enter a clear season label such as 2026 or 2026/27."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_TITLE="Save the season"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_DESCRIPTION="Save the published season and continue with the operational project."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_TITLE="Create the project"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_DESCRIPTION="The project connects the competition, season and sport type into one operational edition."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_TITLE="Project name"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_DESCRIPTION="Enter a name that identifies this competition edition in administration and frontend output."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_TITLE="Select the competition"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_DESCRIPTION="Select the competition you created earlier in this tour."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_TITLE="Select the season"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_DESCRIPTION="Select the season you created earlier in this tour."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_TITLE="Select the sport type"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_DESCRIPTION="Select the sport type created at the beginning of this tour."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_TITLE="Project format"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_DESCRIPTION="Choose the format supported by the selected sport profile, such as league, cup, tournament or race."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_TITLE="Save the project"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_DESCRIPTION="Save the project as a draft. Participants, stages and scheduling are configured from its project panel."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_TITLE="Competition foundation created"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_DESCRIPTION="The newest project is shown first. Open it to assign participants, create stages and generate or enter its programme."
