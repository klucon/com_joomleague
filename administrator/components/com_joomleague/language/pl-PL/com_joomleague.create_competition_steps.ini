; Polish translation. Untranslated entries are omitted.
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_TITLE="Zanim zaczniesz"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_DESCRIPTION="Przewodnik zapisze cztery powiązane rekordy. Przygotuj nazwę rozgrywek, nazwę sezonu i krótki, unikalny kod dyscypliny sportowej. Utworzony projekt pozostanie szkicem do czasu dodania uczestników i struktury organizacyjnej."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_TITLE="Utwórz dyscyplinę sportową"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_DESCRIPTION="Najpierw utwórz roboczą dyscyplinę sportową, która powiąże rozgrywki z jedną niezmienną wersją profilu sportowego."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_TITLE="Nazwa dyscypliny sportowej"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_DESCRIPTION="Wprowadź nazwę używaną przez administratorów, np. Piłka nożna lub Piłka nożna seniorów."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_TITLE="Kod dyscypliny sportowej"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_DESCRIPTION="Wprowadź krótki, unikalny kod techniczny złożony z małych liter, cyfr, łączników lub znaków podkreślenia."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_TITLE="Profil sportowy"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_DESCRIPTION="Wybierz dostarczoną wersję profilu definiującą zasady, pozycje, zdarzenia, statystyki i punktację."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_TITLE="Zapisz dyscyplinę sportową"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_DESCRIPTION="Zapisz dyscyplinę sportową. Włączone opcje inicjalizacji utworzą również wybrane domyślne definicje profilu."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_TITLE="Utwórz rozgrywki"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_DESCRIPTION="Teraz określ stałą tożsamość rozgrywek, której można używać w wielu sezonach."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_TITLE="Nazwa rozgrywek"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_DESCRIPTION="Wprowadź publiczną nazwę rozgrywek, np. Liga okręgowa, grupa B."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_TITLE="Zapisz rozgrywki"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_DESCRIPTION="Zapisz opublikowane rozgrywki i przejdź do ich sezonu."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_TITLE="Utwórz sezon"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_DESCRIPTION="Sezon grupuje jeden lub więcej projektów rozgrywek we wspólnym okresie. Dokładne daty rozpoczęcia i zakończenia nie są wymagane."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_TITLE="Nazwa sezonu"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_DESCRIPTION="Wprowadź czytelną nazwę sezonu, np. 2026 lub 2026/27."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_TITLE="Zapisz sezon"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_DESCRIPTION="Zapisz opublikowany sezon i przejdź do projektu rozgrywek."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_TITLE="Utwórz projekt"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_DESCRIPTION="Projekt łączy rozgrywki, sezon i dyscyplinę sportową w jedną edycję organizacyjną."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_TITLE="Nazwa projektu"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_DESCRIPTION="Wprowadź nazwę identyfikującą tę edycję rozgrywek na zapleczu i w witrynie."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_TITLE="Wybierz rozgrywki"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_DESCRIPTION="Wybierz rozgrywki utworzone wcześniej w tym przewodniku."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_TITLE="Wybierz sezon"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_DESCRIPTION="Wybierz sezon utworzony wcześniej w tym przewodniku."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_TITLE="Wybierz dyscyplinę sportową"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_DESCRIPTION="Wybierz dyscyplinę sportową utworzoną na początku tego przewodnika."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_TITLE="Format projektu"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_DESCRIPTION="Wybierz format obsługiwany przez wybrany profil sportowy, np. ligę, puchar, turniej lub wyścig."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_TITLE="Zapisz projekt"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_DESCRIPTION="Zapisz projekt jako szkic. Uczestników, etapy i harmonogram konfiguruje się w panelu projektu."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_TITLE="Podstawa rozgrywek została utworzona"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_DESCRIPTION="Najnowszy projekt jest wyświetlany jako pierwszy. Otwórz go, aby przypisać uczestników, utworzyć etapy i wygenerować lub wprowadzić terminarz."
