name: Build Joomla package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        run: python3 build/package.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: joomleague-package
          path: dist/pkg_joomleague-*.zip
          if-no-files-found: error

