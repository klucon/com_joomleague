name: Verify JoomLeague 6.2

on:
  pull_request:
    branches: [6.2-dev]
  push:
    branches: [6.2-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joomleague-6.2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }} verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils zip unzip

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find administrator components modules plugins tests -type f -name '*.php' -print0)

      - name: Run unit verification
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/Unit/*.php; do
            php "$test"
          done

      - name: Run foundation verification
        run: php tests/Architecture/verify-foundation.php

      - name: Run release contracts
        run: ./tests/Architecture/verify-release.sh

      - name: Build installable suite
        if: matrix.php == '8.3'
        run: ./build/build-package.sh

      - name: Verify suite archive
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'pkg_joomleague-*.zip' -print -quit)"
          test -n "$package"
          unzip -t "$package"
