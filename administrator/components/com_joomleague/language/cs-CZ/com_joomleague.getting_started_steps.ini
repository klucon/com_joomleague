COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_TITLE="Přehled systému"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_DESCRIPTION="Přehled ukazuje množství aktuálně uloženého obsahu. Nová instalace začíná s dodanými sportovními profily, zatímco data soutěží zůstávají prázdná."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_TITLE="Začněte sportovním profilem"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_DESCRIPTION="Sportovní profily definují pravidla, pozice, události, statistiky a model skórování. Z požadovaného profilu vytvořte sportovní typ."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_TITLE="Definujte soutěž"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_DESCRIPTION="Soutěž představuje stálou identitu ligy, poháru, turnaje, závodu nebo jiného typu klání napříč sezónami."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_TITLE="Vytvořte projekt"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_DESCRIPTION="Projekt je konkrétní ročník soutěže v dané sezóně. Zde se spravují fáze, účastníci, program a výsledky."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_TITLE="Nastavte prezentaci"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_DESCRIPTION="Globální šablony profilů poskytují výchozí nastavení pro jednotlivé sporty. Projektová šablona je může změnit pro jeden projekt bez zásahu do sportovního základu."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_TITLE="Nástroje a datové operace"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_DESCRIPTION="Nástroje obsahují export databáze, SQL import, správu jazyků a další řízené údržbové operace. Průvodce lze kdykoli znovu spustit z nabídky Průvodci."
