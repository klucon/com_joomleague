COM_JOOMLEAGUE_FES_RANKING_PARAM_DESCR_DISPLAY_COLUMNS="Použijte následující kódy oddělené čárkou:<br/> PLAYED – odehrané zápasy<br/> WINS – výhry<br/> LOSSES – prohry<br/> TIES – remízy<br/> WOT – výhry v prodloužení<br/> WSO – výhry na nájezdy/penalty<br/> LOT – prohry v prodloužení<br/> LSO – prohry na nájezdy/penalty<br/> SCOREFOR – vstřelené skóre<br/> SCOREAGAINST – obdržené skóre<br/> SCOREPCT – procento skóre (vstřelené/obdržené × 100)<br/> RESULTS – skóre ve tvaru vstřelené:obdržené<br/> DIFF – rozdíl skóre (vstřelené − obdržené)<br/> POINTS – celkové body (včetně počátečních)<br/> BONUS – bonusové/trestné body<br/> START – počáteční body týmu<br/> LEGS – sety/legy ve tvaru vyhrané:prohrané<br/> LEGS_DIFF – rozdíl setů/legů<br/> GB – ztráta na vedoucí tým (games back)<br/> LEGS_RATIO – poměr vyhraných a prohraných setů/legů<br/> WINPCT – procento výher<br/> QUOT – body na zápas (bez počátečních bodů)<br/> NEGPOINTS – ztrátové (záporné) body<br/> OLDNEGPOINTS – body ve tvaru získané:ztrátové (starší zobrazení)<br/> POINTS_RATIO – poměr bodů k záporným bodům<br/>TADMIN – uživatelské jméno správce týmu<br/>GFA – průměr vstřeleného skóre na zápas<br/>GAA – průměr obdrženého skóre na zápas<br/>PPG – průměr bodů na zápas (bez počátečních bodů)<br/>PPP – procento ze zisku bodů z maximálně možných bodů<br/>LASTGAMES – forma z posledních zápasů (ikony výhra/remíza/prohra)<br/>"
