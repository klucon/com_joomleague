; com_menus' menu item edit screen (ItemModel::getItem()/save(), the "type
; == component" switch case) loads THIS admin .ini for a component-type
; menu item's own link — `$lang->load($option, JPATH_ADMINISTRATOR) ||
; $lang->load($option, JPATH_ADMINISTRATOR . '/components/' . $option)` —
; never the site .ini where the rest of a site view's strings live.
; Duplicate every site view's request/params field label pair here too, or
; the menu item edit screen shows the raw key. Fourth occurrence of this
; exact "which of several possible files does this specific admin screen
; actually load" trap this session — see docs/FRONTEND_MODULE_ROADMAP.md.
