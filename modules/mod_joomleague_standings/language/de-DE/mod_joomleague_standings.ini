MOD_JOOMLEAGUE_STANDINGS_NO_PROJECT="Für dieses Modul wurde noch kein Projekt konfiguriert."
MOD_JOOMLEAGUE_STANDINGS_EMPTY="Für dieses Projekt wurde noch keine Tabelle veröffentlicht."
MOD_JOOMLEAGUE_STANDINGS_UNAVAILABLE="Für dieses Projekt ist keine Tabelle verfügbar."
MOD_JOOMLEAGUE_STANDINGS_SCOPE_LABEL="Tabellenbereich"
MOD_JOOMLEAGUE_STANDINGS_SCOPE_DESC="Wählen Sie einen im Sportprofil definierten Tabellenbereich aus. Speichern Sie nach einem Projektwechsel, um dessen Bereiche neu zu laden. Bei Übernahme wird die Standardeinstellung des Profils verwendet."
MOD_JOOMLEAGUE_STANDINGS_OFFSET_LABEL="Zeilenversatz"
MOD_JOOMLEAGUE_STANDINGS_OFFSET_DESC="Überspringt die angegebene Anzahl von Zeilen. Ein Versatz größer als 0 hat Vorrang vor der Zentrierung auf den hervorgehobenen Teilnehmer."
MOD_JOOMLEAGUE_STANDINGS_DENSITY_LABEL="Zeilendichte"
