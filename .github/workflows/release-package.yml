name: Release Joomla package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate tag version
        shell: bash
        run: |
          manifest_version="$(python3 build/validate_versions.py)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Manifest version $manifest_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build package
        run: |
          python3 build/package.py
          python3 build/release_metadata.py

      - name: Resolve package
        id: package
        shell: bash
        run: |
          package="$(ls dist/pkg_joomleague-*.zip | head -n 1)"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$package")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.path }}
            dist/joomleague-update.xml
            dist/joomleague-changelog.xml
          generate_release_notes: true
          fail_on_unmatched_files: true
