COM_JOOMLEAGUE_ABOUT_EYEBROW="Universelle Verwaltung von Sportwettbewerben"
COM_JOOMLEAGUE_ABOUT_VIEW_TITLE="Über JoomLeague"
COM_JOOMLEAGUE_ABOUT_INTRO="JoomLeague ist eine quelloffene Joomla-Erweiterung zur Organisation und Veröffentlichung von Sportwettbewerben."
COM_JOOMLEAGUE_ABOUT_VIEW_DESC="Die Sportprofilverträge unterstützen Mannschafts- und Einzeldisziplinen, ohne jeden Wettbewerb auf eine Begegnung zwischen zwei Mannschaften zu reduzieren."
COM_JOOMLEAGUE_ABOUT_META_DESCRIPTION="Lernen Sie JoomLeague kennen, die quelloffene und sportartenübergreifende Wettbewerbsverwaltung für Joomla."
COM_JOOMLEAGUE_ABOUT_CAPABILITIES_TITLE="Für verschiedene Sportarten entwickelt"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_TITLE="Sportartenübergreifende Grundlage"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_DESC="Profile definieren Teilnehmer, Phasen, Ergebnisse, Ereignisse, Statistiken und Offizielle für jede Sportart."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_TITLE="Wettbewerbsablauf"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_DESC="Verwalten Sie Projekte, Teilnehmer, Veranstaltungen, Aufstellungen, Ergebnisse, Tabellen und Übergänge zwischen Phasen."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_TITLE="Öffentliche Darstellung"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_DESC="Veröffentlichen Sie Terminpläne, Ergebnisse, Tabellen, Ranglisten, Berichte, Personen, Vereine, Mannschaften und Austragungsorte über responsive Frontend-Ansichten und Module."
COM_JOOMLEAGUE_ABOUT_PURPOSE_TITLE="Ein System für den gesamten Wettbewerb"
COM_JOOMLEAGUE_ABOUT_PURPOSE_P1="JoomLeague verbindet den gesamten Lebenszyklus eines Wettbewerbs in einer strukturierten Umgebung. Organisatoren können Saisons und Wettbewerbe vorbereiten, Teilnehmer registrieren, Phasen und Runden anlegen, Veranstaltungen planen sowie Aufstellungen, Offizielle, Ereignisse, Statistiken und Ergebnisse verwalten."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P2="Das System setzt weder Heim- und Auswärtsmannschaften noch einen einzelnen numerischen Ergebniswert für jede Sportart voraus. Versionierte Sportprofile beschreiben die Regeln und Daten jeder Disziplin, darunter Einzelteilnehmer, Veranstaltungen mit mehreren Teilnehmern, Sätze, Abschnitte, zeitgemessene Leistungen und Übergänge zwischen Phasen."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P3="Dieselben verwalteten Daten versorgen öffentliche Terminpläne, Ergebnisberichte, Tabellen, Turnierbäume, Ranglisten und Kalenderfeeds. Joomla-Menüeinträge, Module, Zugriffsebenen, benutzerdefinierte Felder, Suchindex und Mehrsprachigkeit ermöglichen jeder Website eine eigene Wettbewerbsdarstellung."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_TITLE="Für wen JoomLeague geeignet ist"
COM_JOOMLEAGUE_ABOUT_AUDIENCE_CLUBS="Sportvereine, die Mannschaften, Personen, Austragungsorte und ihren Veranstaltungsplan veröffentlichen."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_LEAGUES="Ligen und Verbände, die strukturierte Wettbewerbe über mehrere Saisons hinweg verwalten."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_ORGANISERS="Turnier- und Veranstaltungsorganisatoren, die mit unterschiedlichen Formaten und Sportarten arbeiten."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_COMMUNITIES="Community- und Fanseiten, die zuverlässige, wiederverwendbare Wettbewerbsdaten benötigen."
