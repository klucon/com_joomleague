; Joomla's module edit screen (com_modules ModuleModel::preprocessForm())
; only loads this .ini, never .sys.ini, even though its template shows the
; module's name/description from sys.ini-only keys — duplicate them here so
; that screen resolves them too. Keep in sync with the .sys.ini file.
MOD_JOOMLEAGUE_STANDINGS="JoomLeague - Standings"
MOD_JOOMLEAGUE_STANDINGS_XML_DESCRIPTION="Displays the current standings table for a JoomLeague project."
MOD_JOOMLEAGUE_STANDINGS_PROJECT_LABEL="Project"
MOD_JOOMLEAGUE_STANDINGS_PROJECT_DESC="The JoomLeague project whose standings should be shown."
MOD_JOOMLEAGUE_STANDINGS_STAGE_LABEL="Stage ID"
MOD_JOOMLEAGUE_STANDINGS_STAGE_DESC="Restrict the standings to a single stage. Leave at 0 to show the whole-project standings."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_LABEL="Highlight entry"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_DESC="Visually highlight this team/entry's row. The list only shows entries from the project selected above — pick and save the project first. When combined with a row limit, the window of shown rows is centred on this entry instead of always starting at rank 1."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_NONE="— None —"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_LABEL="Highlight style"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_DESC="How the highlighted entry's row is shown. The row limit's centring still applies regardless of this setting — it only changes the visual treatment."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_ROW="Whole row"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_TEXT="Bold text only"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_NONE="None"
MOD_JOOMLEAGUE_STANDINGS_INHERIT="Use project template"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_LABEL="Show score columns"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SCORE_DESC="Inherit the ranking template setting or override score columns for this module instance."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_LABEL="Show score difference"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_DIFFERENCE_DESC="Inherit the ranking template setting or override score-difference columns for this module instance."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_LABEL="Show set columns"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_SETS_DESC="Inherit the ranking template setting or override set columns for this module instance."
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_LABEL="Show points columns"
MOD_JOOMLEAGUE_STANDINGS_TEMPLATE_SHOW_POINTS_DESC="Inherit the ranking template setting or override points columns for this module instance."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_LABEL="Highlight colour (row)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_DESC="Background colour for the highlighted row. Only used with the Whole row style — combine with Highlight colour (text) below to also set the text colour on top of it."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_LABEL="Highlight colour (text)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_DESC="Text colour for the highlighted row. Used with either highlight style — combine with Highlight colour (row) above when using the Whole row style."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_BOLD_LABEL="Bold"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_ITALIC_LABEL="Italic"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_UNDERLINE_LABEL="Underline"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_LABEL="Row limit"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_DESC="Maximum number of rows to display. 0 shows all rows. If a highlighted entry is set above, the window is centred on it instead of starting at rank 1."
MOD_JOOMLEAGUE_STANDINGS_METRICS_LABEL="Visible columns"
MOD_JOOMLEAGUE_STANDINGS_METRICS_DESC="Choose which columns to show. The list only shows metrics defined by the project selected above — pick and save the project first. Leave everything unchecked to show every column."
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_LABEL="Combined score format"
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_DESC="Show paired for/against columns (score, legs, sets, maps...) as a single 'xx:xx' column instead of two separate ones."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_LABEL="Short column labels"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_DESC="Use short column headers (Z/V/R/P/+/-...) instead of full words, where a short form is defined. Columns without one keep their full label."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_LABEL="Tooltips on short labels"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_DESC="Show the full column name as a hover tooltip on shortened headers, so visitors can still tell what Z/V/R/P/... mean."
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_LABEL="Responsive columns"
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_DESC="On narrow screens, hide all columns except rank, entry and the last visible column, instead of shrinking the table until it scrolls."
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_LABEL="Show project name"
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_DESC="Show the project name as a heading above the table."
MOD_JOOMLEAGUE_STANDINGS_ZONES_FIELDSET_LABEL="Zone lines"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_LABEL="Mark top zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_DESC="Draws a coloured line under the last row of a top zone (e.g. promotion places)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_LABEL="Top zone size"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_DESC="Number of rows from rank 1 that belong to the top zone."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_LABEL="Top zone line colour"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_DESC="Colour of the line marking the bottom of the top zone."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_LABEL="Mark bottom zone"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_DESC="Draws a coloured line above the first row of a bottom zone (e.g. relegation places)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_LABEL="Bottom zone size"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_DESC="Number of rows from the last rank that belong to the bottom zone."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_LABEL="Bottom zone line colour"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_DESC="Colour of the line marking the top of the bottom zone."
MOD_JOOMLEAGUE_STANDINGS_FORM_FIELDSET_LABEL="Recent form"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_LABEL="Show recent form"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_DESC="Adds a column showing each entry's last results as coloured letters (W/D/L), most recent on the right. Only works for two-participant (head-to-head) matches."
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_LABEL="Number of results"
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_DESC="How many recent results to show per entry."
MOD_JOOMLEAGUE_STANDINGS_COLUMN_RANK="#"
MOD_JOOMLEAGUE_STANDINGS_COLUMN_ENTRY="Entry"
MOD_JOOMLEAGUE_STANDINGS_COLUMN_FORM="Form"
MOD_JOOMLEAGUE_STANDINGS_COLUMN_FORM_SHORT="F"
MOD_JOOMLEAGUE_STANDINGS_FORM_WIN="W"
MOD_JOOMLEAGUE_STANDINGS_FORM_DRAW="D"
MOD_JOOMLEAGUE_STANDINGS_FORM_LOSS="L"
MOD_JOOMLEAGUE_STANDINGS_NO_PROJECT="No project has been configured for this module yet."
MOD_JOOMLEAGUE_STANDINGS_EMPTY="Standings for this project have not been published yet."
MOD_JOOMLEAGUE_STANDINGS_UNAVAILABLE="Standings are not available for this project."
