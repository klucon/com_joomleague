COM_JOOMLEAGUE_ABOUT_VIEW_TITLE="O JoomLeague"
COM_JOOMLEAGUE_ABOUT_INTRO="JoomLeague to rozszerzenie Joomla o otwartym kodzie źródłowym do organizowania i publikowania rozgrywek sportowych."
COM_JOOMLEAGUE_ABOUT_VIEW_DESC="Kontrakty profili sportowych obsługują dyscypliny drużynowe i indywidualne bez sprowadzania każdej rywalizacji do meczu dwóch drużyn."
COM_JOOMLEAGUE_ABOUT_META_DESCRIPTION="Poznaj JoomLeague, otwartoźródłowe i niezależne od dyscypliny rozszerzenie do zarządzania rozgrywkami dla Joomla."
COM_JOOMLEAGUE_ABOUT_CAPABILITIES_TITLE="Stworzone dla różnych dyscyplin"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_TITLE="Podstawa niezależna od dyscypliny"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_DESC="Profile definiują uczestników, fazy, wyniki, zdarzenia, statystyki i oficjeli każdej dyscypliny."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_TITLE="Przebieg obsługi rozgrywek"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_DESC="Zarządzaj projektami, uczestnikami, wydarzeniami z terminarza, składami, wynikami, tabelami i awansem między etapami."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_TITLE="Prezentacja publiczna"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_DESC="Publikuj terminarze, wyniki, tabele, rankingi, raporty, osoby, kluby, drużyny i obiekty za pomocą responsywnych widoków i modułów witryny."
COM_JOOMLEAGUE_ABOUT_PURPOSE_TITLE="Jeden system dla całych rozgrywek"
COM_JOOMLEAGUE_ABOUT_PURPOSE_P1="JoomLeague łączy cały cykl życia rozgrywek w jednym uporządkowanym środowisku. Organizatorzy mogą przygotowywać sezony i rozgrywki, rejestrować uczestników, budować fazy i rundy, planować wydarzenia w terminarzu oraz utrzymywać składy, oficjeli, zdarzenia, statystyki i wyniki."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P2="System nie zakłada, że każda dyscyplina używa drużyn gospodarzy i gości lub jednego wyniku liczbowego. Wersjonowane profile sportowe opisują zasady i dane wymagane przez każdą dyscyplinę, w tym zawodników indywidualnych, wydarzenia wieloosobowe, sety, segmenty, wyniki czasowe i awans między etapami."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P3="Te same zarządzane dane zasilają publiczne terminarze, raporty wyników, tabele, drabinki, rankingi i kanały kalendarza. Pozycje menu Joomla, moduły, poziomy dostępu, pola dodatkowe, wyszukiwanie indeksujące i obsługa wielojęzyczności pozwalają każdej witrynie prezentować rozgrywki na własny sposób."
