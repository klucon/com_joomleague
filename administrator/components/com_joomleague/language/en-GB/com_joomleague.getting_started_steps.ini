COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_TITLE="System overview"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_DESCRIPTION="The overview shows how much content currently exists. A new installation starts with bundled sport profiles while competition data remains empty."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_TITLE="Start with a sport profile"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_DESCRIPTION="Sport profiles define the rules, positions, events, statistics and scoring model. Create a sport type from the profile you want to use."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_TITLE="Define the competition"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_DESCRIPTION="Competitions provide the stable identity of a league, cup, tournament, race or another contest across seasons."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_TITLE="Build a project"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_DESCRIPTION="A project is the operational edition of a competition for a season. This is where stages, participants, schedules and results are managed."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_TITLE="Control the presentation"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_DESCRIPTION="Global profile templates provide sport-specific defaults. Project templates can override them for one project without changing the profile foundation."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_TITLE="Utilities and data operations"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_DESCRIPTION="Tools contain database exports, SQL import, language management and other controlled maintenance operations. You can restart this tour from the Guided Tours menu at any time."
