COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_TITLE="Bevor Sie beginnen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PREPARE_DESCRIPTION="Die Tour speichert vier miteinander verknüpfte Datensätze. Bereiten Sie einen Wettbewerbsnamen, einen Saisonnamen und einen kurzen eindeutigen Code für die Sportart vor. Das Projekt bleibt ein Entwurf, bis Sie Teilnehmer und die zugehörige Struktur hinzugefügt haben."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_TITLE="Sportart erstellen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_REDIRECT_DESCRIPTION="Erstellen Sie zunächst die verwendete Sportart, die den Wettbewerb mit einer unveränderlichen Version des Sportprofils verknüpft."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_TITLE="Name der Sportart"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_NAME_DESCRIPTION="Geben Sie den in der Administration verwendeten Namen ein, beispielsweise Fußball oder Seniorenfußball."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_TITLE="Sportartcode"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_CODE_DESCRIPTION="Geben Sie einen kurzen eindeutigen technischen Code aus Kleinbuchstaben, Ziffern, Bindestrichen oder Unterstrichen ein."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_TITLE="Sportprofil"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_PROFILE_DESCRIPTION="Wählen Sie die mitgelieferte Profilversion aus, die Regeln, Positionen, Ereignisse, Statistiken und Wertung definiert."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_TITLE="Sportart speichern"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SPORTTYPE_SAVE_DESCRIPTION="Speichern Sie die Sportart. Aktivierte Initialisierungsoptionen legen außerdem die ausgewählten Standarddefinitionen des Profils an."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_TITLE="Wettbewerb erstellen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_REDIRECT_DESCRIPTION="Legen Sie nun die dauerhafte Identität des Wettbewerbs fest, die über mehrere Saisons hinweg verwendet werden kann."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_TITLE="Wettbewerbsname"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_NAME_DESCRIPTION="Geben Sie den öffentlichen Wettbewerbsnamen ein, beispielsweise Regionalliga Gruppe B."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_TITLE="Wettbewerb speichern"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITION_SAVE_DESCRIPTION="Speichern Sie den veröffentlichten Wettbewerb und fahren Sie mit seiner Saison fort."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_TITLE="Saison erstellen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_REDIRECT_DESCRIPTION="Eine Saison fasst ein oder mehrere Wettbewerbsprojekte zu einem gemeinsamen Zeitraum zusammen. Genaue Anfangs- und Enddaten sind nicht erforderlich."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_TITLE="Saisonname"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_NAME_DESCRIPTION="Geben Sie eine eindeutige Saisonbezeichnung ein, etwa 2026 oder 2026/27."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_TITLE="Saison speichern"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_SEASON_SAVE_DESCRIPTION="Speichern Sie die veröffentlichte Saison und fahren Sie mit dem eigentlichen Projekt fort."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_TITLE="Projekt erstellen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_REDIRECT_DESCRIPTION="Das Projekt verbindet Wettbewerb, Saison und Sportart zu einer konkreten Austragung."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_TITLE="Projektname"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_NAME_DESCRIPTION="Geben Sie einen Namen ein, der diese Wettbewerbsaustragung in der Administration und im Frontend eindeutig bezeichnet."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_TITLE="Wettbewerb auswählen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_COMPETITION_DESCRIPTION="Wählen Sie den Wettbewerb aus, den Sie zuvor in dieser Tour erstellt haben."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_TITLE="Saison auswählen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SEASON_DESCRIPTION="Wählen Sie die Saison aus, die Sie zuvor in dieser Tour erstellt haben."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_TITLE="Sportart auswählen"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SPORTTYPE_DESCRIPTION="Wählen Sie die zu Beginn dieser Tour erstellte Sportart aus."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_TITLE="Projektformat"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_TYPE_DESCRIPTION="Wählen Sie ein vom ausgewählten Sportprofil unterstütztes Format aus, etwa Liga, Pokal, Turnier oder Rennen."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_TITLE="Projekt speichern"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_SAVE_DESCRIPTION="Speichern Sie das Projekt als Entwurf. Teilnehmer, Phasen und Terminplanung werden über die Projektverwaltung eingerichtet."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_TITLE="Wettbewerbsgrundlage erstellt"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECT_OPEN_DESCRIPTION="Das neueste Projekt wird zuerst angezeigt. Öffnen Sie es, um Teilnehmer zuzuweisen, Phasen anzulegen und den Veranstaltungsplan zu erzeugen oder einzugeben."
