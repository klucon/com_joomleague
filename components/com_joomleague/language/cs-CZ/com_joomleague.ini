COM_JOOMLEAGUE_ABOUT_VIEW_TITLE="O JoomLeague"
COM_JOOMLEAGUE_ABOUT_INTRO="JoomLeague je open-source rozšíření pro Joomla určené k organizaci a prezentaci sportovních soutěží."
COM_JOOMLEAGUE_ABOUT_VIEW_DESC="Díky kontraktům sportovních profilů podporuje týmové i individuální disciplíny, aniž by každou soutěž omezovalo na zápas dvou týmů."
COM_JOOMLEAGUE_ABOUT_META_DESCRIPTION="Poznejte JoomLeague, open-source a sportovně neutrální rozšíření pro správu soutěží v Joomla."
COM_JOOMLEAGUE_ABOUT_CAPABILITIES_TITLE="Vytvořeno pro různé sporty"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_TITLE="Sportovně neutrální základ"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_SPORT_NEUTRAL_DESC="Profily definují účastníky, fáze, výsledky, události, statistiky a funkcionáře pro jednotlivé sporty."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_TITLE="Průběh soutěže"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_WORKFLOW_DESC="Spravujte projekty, účastníky, položky programu, sestavy, výsledky, tabulky a postup mezi fázemi."
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_TITLE="Veřejná prezentace"
COM_JOOMLEAGUE_ABOUT_CAPABILITY_PUBLISHING_DESC="Publikujte rozpisy, výsledky, tabulky, žebříčky, reporty, osoby, kluby, týmy a sportoviště prostřednictvím responzivních zobrazení a modulů."
COM_JOOMLEAGUE_ABOUT_PURPOSE_TITLE="Jeden systém pro celou soutěž"
COM_JOOMLEAGUE_ABOUT_PURPOSE_P1="JoomLeague propojuje celý životní cyklus soutěže v jednom strukturovaném prostředí. Pořadatelé mohou připravovat sezóny a soutěže, registrovat účastníky, vytvářet fáze a kola, plánovat položky programu a spravovat sestavy, funkcionáře, události, statistiky i výsledky."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P2="Systém nepředpokládá, že každý sport používá domácí a hostující tým nebo jediné číselné skóre. Verzované sportovní profily popisují pravidla a data potřebná pro jednotlivé disciplíny včetně individuálních účastníků, událostí s více účastníky, setů, dílčích částí, měřených výkonů a postupu mezi fázemi."
COM_JOOMLEAGUE_ABOUT_PURPOSE_P3="Stejná spravovaná data slouží pro veřejné rozpisy, reporty výsledků, tabulky, pavouky, žebříčky a kalendářové kanály. Položky menu Joomla, moduly, úrovně přístupu, vlastní pole, chytré vyhledávání a vícejazyčnost umožňují každému webu prezentovat soutěž vlastním způsobem."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_TITLE="Pro koho je JoomLeague určena"
COM_JOOMLEAGUE_ABOUT_AUDIENCE_CLUBS="Sportovní kluby prezentující týmy, osoby, sportoviště a svůj program."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_LEAGUES="Ligy a svazy spravující strukturované soutěže napříč sezónami."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_ORGANISERS="Pořadatelé turnajů a událostí pracující s různými formáty a sporty."
COM_JOOMLEAGUE_ABOUT_AUDIENCE_COMMUNITIES="Komunitní a fanouškovské weby, které potřebují spolehlivá a opakovaně použitelná data soutěží."
