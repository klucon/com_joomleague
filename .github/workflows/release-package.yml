name: Release Joomla package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        run: python3 build/package.py

      - name: Resolve package
        id: package
        shell: bash
        run: |
          package="$(ls dist/pkg_joomleague-*.zip | head -n 1)"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$package")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true

