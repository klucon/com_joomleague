COM_JOOMLEAGUE_STANDINGS_PARAMS_METRICS_LABEL="Zobrazené sloupce"
COM_JOOMLEAGUE_STANDINGS_PARAMS_METRICS_DESC="Vyberte, které sloupce se mají zobrazit. Nabídka obsahuje jen metriky definované projektem vybraným výše — projekt tedy nejdřív vyberte a uložte. Když nezaškrtnete nic, zobrazí se všechny sloupce."
