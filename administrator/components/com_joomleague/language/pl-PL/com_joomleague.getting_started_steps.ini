; Polish translation. Untranslated entries are omitted.
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_TITLE="Przegląd systemu"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_OVERVIEW_DESCRIPTION="Przegląd pokazuje aktualną ilość treści. Nowa instalacja zawiera dostarczone profile sportowe, natomiast dane rozgrywek pozostają puste."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_TITLE="Zacznij od profilu sportowego"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROFILES_DESCRIPTION="Profile sportowe definiują zasady, pozycje, zdarzenia, statystyki i model punktacji. Utwórz dyscyplinę sportową na podstawie profilu, którego chcesz używać."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_TITLE="Zdefiniuj rozgrywki"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_COMPETITIONS_DESCRIPTION="Rozgrywki zapewniają stałą tożsamość ligi, pucharu, turnieju, wyścigu lub innej rywalizacji w kolejnych sezonach."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_TITLE="Zbuduj projekt"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_PROJECTS_DESCRIPTION="Projekt jest organizacyjną edycją rozgrywek w danym sezonie. To tutaj zarządza się etapami, uczestnikami, harmonogramami i wynikami."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_TITLE="Dostosuj prezentację"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TEMPLATES_DESCRIPTION="Globalne szablony profili zapewniają ustawienia domyślne właściwe dla dyscypliny. Szablony projektu mogą je zastąpić dla jednego projektu bez zmiany podstawowego profilu."
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_TITLE="Narzędzia i operacje na danych"
COM_JOOMLEAGUE_GUIDEDTOUR_STEP_TOOLS_DESCRIPTION="Narzędzia obejmują eksport bazy danych, import SQL, zarządzanie językami i inne kontrolowane operacje konserwacyjne. W dowolnej chwili możesz ponownie uruchomić ten przewodnik z menu przewodników."
