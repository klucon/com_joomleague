; Joomla's module edit screen (com_modules ModuleModel::preprocessForm())
; only loads this .ini, never .sys.ini, even though its template shows the
; module's name/description from sys.ini-only keys — duplicate them here so
; that screen resolves them too. Keep in sync with the .sys.ini file.
MOD_JOOMLEAGUE_STANDINGS="JoomLeague - Tabulka soutěže"
MOD_JOOMLEAGUE_STANDINGS_XML_DESCRIPTION="Zobrazí aktuální tabulku soutěže pro zvolený projekt JoomLeague."
MOD_JOOMLEAGUE_STANDINGS_PROJECT_LABEL="Projekt"
MOD_JOOMLEAGUE_STANDINGS_PROJECT_DESC="Projekt JoomLeague, jehož tabulka se má zobrazit."
MOD_JOOMLEAGUE_STANDINGS_STAGE_LABEL="ID fáze"
MOD_JOOMLEAGUE_STANDINGS_STAGE_DESC="Omezí tabulku na jednu fázi. Ponechte na 0 pro celoprojektovou tabulku."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_LABEL="Zvýraznit účastníka"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_DESC="Vizuálně zvýrazní řádek tohoto týmu/účastníka. Nabídka obsahuje jen účastníky z projektu vybraného výše — projekt tedy nejdřív vyberte a uložte. V kombinaci s omezením počtu řádků se zobrazené okno vycentruje kolem tohoto účastníka místo toho, aby vždy začínalo na 1. místě."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_NONE="— Žádný —"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_LABEL="Styl zvýraznění"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_DESC="Jak se řádek zvýrazněného účastníka zobrazí. Centrování podle omezení počtu řádků platí bez ohledu na toto nastavení — mění se jen vizuální podoba."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_ROW="Celý řádek"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_TEXT="Pouze tučný text"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_STYLE_NONE="Žádné"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_LABEL="Barva zvýraznění (řádek)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_ROW_DESC="Barva pozadí zvýrazněného řádku. Uplatní se jen u stylu Celý řádek — zkombinujte s Barvou zvýraznění (text) níže, chcete-li na pozadí nastavit i barvu textu."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_LABEL="Barva zvýraznění (text)"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_COLOR_TEXT_DESC="Barva textu zvýrazněného řádku. Platí u obou stylů — u stylu Celý řádek ji zkombinujte s Barvou zvýraznění (řádek) výše."
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_BOLD_LABEL="Tučně"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_ITALIC_LABEL="Kurzívou"
MOD_JOOMLEAGUE_STANDINGS_HIGHLIGHT_UNDERLINE_LABEL="Podtržené"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_LABEL="Počet řádků"
MOD_JOOMLEAGUE_STANDINGS_LIMIT_DESC="Maximální počet zobrazených řádků. 0 zobrazí všechny. Pokud je výše nastavený zvýrazněný účastník, okno se vycentruje kolem něj místo začátku na 1. místě."
MOD_JOOMLEAGUE_STANDINGS_METRICS_LABEL="Zobrazené sloupce"
MOD_JOOMLEAGUE_STANDINGS_METRICS_DESC="Vyberte, které sloupce se mají zobrazit. Nabídka obsahuje jen metriky definované projektem vybraným výše — projekt tedy nejdřív vyberte a uložte. Když nezaškrtnete nic, zobrazí se všechny sloupce."
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_LABEL="Kombinovaný formát skóre"
MOD_JOOMLEAGUE_STANDINGS_COMBINED_SCORE_DESC="Zobrazí spárované sloupce pro/proti (skóre, legy, sety, mapy...) jako jeden sloupec ve formátu „xx:xx" místo dvou samostatných."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_LABEL="Zkrácené názvy sloupců"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABELS_DESC="Použije krátká záhlaví sloupců (Z/V/R/P/+/-...) místo celých slov, tam kde je krátká forma definovaná. Sloupce bez ní si ponechají plný název."
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_LABEL="Nápověda u zkratek"
MOD_JOOMLEAGUE_STANDINGS_SHORT_LABEL_TOOLTIPS_DESC="Zobrazí plný název sloupce jako nápovědu při najetí myší nad zkrácené záhlaví, aby návštěvník poznal, co Z/V/R/P/... znamená."
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_LABEL="Responzivní sloupce"
MOD_JOOMLEAGUE_STANDINGS_RESPONSIVE_DESC="Na úzkých obrazovkách skryje všechny sloupce kromě pořadí, účastníka a posledního viditelného sloupce, místo aby se tabulka jen zmenšovala a posouvala."
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_LABEL="Zobrazit název projektu"
MOD_JOOMLEAGUE_STANDINGS_SHOW_PROJECT_NAME_DESC="Zobrazí název projektu jako nadpis nad tabulkou."
MOD_JOOMLEAGUE_STANDINGS_ZONES_FIELDSET_LABEL="Hraniční čáry"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_LABEL="Vyznačit horní zónu"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_ENABLED_DESC="Vykreslí barevnou čáru pod posledním řádkem horní zóny (např. místa pro postup)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_LABEL="Velikost horní zóny"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COUNT_DESC="Počet řádků od 1. místa, které patří do horní zóny."
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_LABEL="Barva čáry horní zóny"
MOD_JOOMLEAGUE_STANDINGS_ZONE_TOP_COLOR_DESC="Barva čáry oddělující spodní okraj horní zóny."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_LABEL="Vyznačit spodní zónu"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_ENABLED_DESC="Vykreslí barevnou čáru nad prvním řádkem spodní zóny (např. místa pro sestup)."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_LABEL="Velikost spodní zóny"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COUNT_DESC="Počet řádků od posledního místa, které patří do spodní zóny."
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_LABEL="Barva čáry spodní zóny"
MOD_JOOMLEAGUE_STANDINGS_ZONE_BOTTOM_COLOR_DESC="Barva čáry oddělující horní okraj spodní zóny."
MOD_JOOMLEAGUE_STANDINGS_FORM_FIELDSET_LABEL="Forma"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_LABEL="Zobrazit formu"
MOD_JOOMLEAGUE_STANDINGS_FORM_ENABLED_DESC="Přidá sloupec s posledními výsledky každého účastníka jako barevná písmena (V/R/P), nejnovější vpravo. Funguje jen pro zápasy dvou účastníků (head-to-head)."
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_LABEL="Počet výsledků"
MOD_JOOMLEAGUE_STANDINGS_FORM_COUNT_DESC="Kolik posledních výsledků se má u účastníka zobrazit."
