COM_KLUCONCOUNTRIES_FACT_EUROPE_AREA_SCOPE="Rounded geographic estimate, approximately 10.4 million square kilometres. Boundaries with Asia are conventional; this is not the sum of member countries' full areas."
COM_KLUCONCOUNTRIES_FACT_EUROPE_POPULATION_SCOPE="OWID continental aggregate based on UN WPP 2024, reference year 2023. Whole-country statistical assignments differ from physical boundaries and the registry's multiple memberships. Not a 2026 census."
COM_KLUCONCOUNTRIES_FACT_EUROPE_HIGHEST_NAME="Mount Elbrus"
COM_KLUCONCOUNTRIES_FACT_EUROPE_HIGHEST_SCOPE="Caucasus, Russia; uses the convention placing this summit in Europe."
COM_KLUCONCOUNTRIES_FACT_EUROPE_LOWEST_NAME="Caspian Depression / Caspian shoreline"
COM_KLUCONCOUNTRIES_FACT_EUROPE_LOWEST_SCOPE="Historical approximate shoreline reference from NASA photograph documentation, not the current lake level. The water level changes over time."
COM_KLUCONCOUNTRIES_FACT_EUROPE_RIVER_NAME="Volga"
COM_KLUCONCOUNTRIES_FACT_EUROPE_RIVER_SCOPE="Conventional approximate river length; measurements depend on source and channel definitions."
COM_KLUCONCOUNTRIES_FACT_EUROPE_LAKE_NAME="Caspian Sea"
COM_KLUCONCOUNTRIES_FACT_EUROPE_LAKE_SCOPE="Approximate conventional surface-area reference for the shared European-Asian inland water body. Water level and area vary; Lake Ladoga is the largest lake wholly within Europe."
COM_KLUCONCOUNTRIES_FACT_AFRICA_AREA_SCOPE="Approximate continental land-area reference including associated islands; geographic boundary conventions can differ."
COM_KLUCONCOUNTRIES_FACT_AFRICA_POPULATION_SCOPE="OWID aggregate from UN WPP 2024 for 2023, using whole-country statistical assignments. This is not a sum of duplicate transcontinental registry entries or a 2026 census."
COM_KLUCONCOUNTRIES_FACT_AFRICA_HIGHEST_NAME="Kilimanjaro / Uhuru Peak"
COM_KLUCONCOUNTRIES_FACT_AFRICA_HIGHEST_SCOPE="Tanzania; elevation above mean sea level."
COM_KLUCONCOUNTRIES_FACT_AFRICA_LOWEST_NAME="Lake Assal"
COM_KLUCONCOUNTRIES_FACT_AFRICA_LOWEST_SCOPE="Djibouti; approximate surface/shoreline elevation below sea level, not lake-bottom depth."
COM_KLUCONCOUNTRIES_FACT_AFRICA_RIVER_NAME="Nile river system"
COM_KLUCONCOUNTRIES_FACT_AFRICA_RIVER_SCOPE="Approximate National Geographic atlas reference. Source-selection methods produce different published lengths."
COM_KLUCONCOUNTRIES_FACT_AFRICA_LAKE_NAME="Lake Victoria"
COM_KLUCONCOUNTRIES_FACT_AFRICA_LAKE_SCOPE="Approximate atlas surface-area reference shared by Tanzania, Uganda and Kenya. Published estimates differ by shoreline definition and water level."
COM_KLUCONCOUNTRIES_FACT_ASIA_AREA_SCOPE="Approximate physical-continent land-area reference. The Europe-Asia boundary is conventional and is not equivalent to whole-country statistical regions."
COM_KLUCONCOUNTRIES_FACT_ASIA_POPULATION_SCOPE="OWID continental aggregate from UN WPP 2024 for 2023. Whole-country statistical assignments differ from geographic boundaries; Russia is not split into a separate Asian population here."
COM_KLUCONCOUNTRIES_FACT_ASIA_HIGHEST_NAME="Mount Everest"
COM_KLUCONCOUNTRIES_FACT_ASIA_HIGHEST_SCOPE="China-Nepal border; official snow-surface height announced in 2020, rather than rock-summit elevation."
COM_KLUCONCOUNTRIES_FACT_ASIA_LOWEST_NAME="Dead Sea shoreline"
COM_KLUCONCOUNTRIES_FACT_ASIA_LOWEST_SCOPE="Dated approximate shoreline level from the cited geological report. The Dead Sea continues to change; this is not a current observation or lake-bottom depth."
COM_KLUCONCOUNTRIES_FACT_ASIA_RIVER_NAME="Yangtze river system"
COM_KLUCONCOUNTRIES_FACT_ASIA_RIVER_SCOPE="Conventional approximate main-system length; headwater selection changes reported measurements."
COM_KLUCONCOUNTRIES_FACT_ASIA_LAKE_NAME="Caspian Sea"
COM_KLUCONCOUNTRIES_FACT_ASIA_LAKE_SCOPE="Shared European-Asian inland water body. Approximate conventional surface area; level and shoreline change over time."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_AREA_SCOPE="Reference continental land area including associated islands. Central America, Greenland and the Caribbean belong to this broad grouping."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_POPULATION_SCOPE="OWID aggregate from UN WPP 2024 for 2023, using the broad North American grouping, not only the Northern America statistical subregion."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_HIGHEST_NAME="Denali / Mount McKinley"
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_HIGHEST_SCOPE="Alaska, United States; rounded metric equivalent of 20,310 feet. Both widely used mountain names are retained."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_LOWEST_NAME="Badwater Basin"
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_LOWEST_SCOPE="Death Valley, United States; exposed land elevation, approximately 282 feet below sea level."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_RIVER_NAME="Mississippi-Missouri river system"
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_RIVER_SCOPE="Approximate combined length published by the National Park Service. Other headwater definitions yield different lengths; this is not the Mississippi alone."
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_LAKE_NAME="Lake Michigan-Huron"
COM_KLUCONCOUNTRIES_FACT_NORTH_AMERICA_LAKE_SCOPE="Hydrologically connected single lake system. If Michigan and Huron are counted separately, Lake Superior is the largest named lake at approximately 82,100 square kilometres."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_AREA_SCOPE="Approximate continental land-area reference including associated islands. Boundaries and inland-water treatment can differ between sources."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_POPULATION_SCOPE="OWID aggregate from UN WPP 2024 for 2023. Whole-country statistical assignments are used, rather than repeatedly counting territory memberships."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_HIGHEST_NAME="Aconcagua"
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_HIGHEST_SCOPE="Argentina; official mean-sea-level height announced by Instituto Geografico Nacional in 2012."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_LOWEST_NAME="Laguna del Carbon"
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_LOWEST_SCOPE="Santa Cruz, Argentina; approximate surface elevation in the Gran Bajo de San Julian depression."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_RIVER_NAME="Amazon river system"
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_RIVER_SCOPE="Conventional approximate length. Alternative headwaters and estuary definitions yield different values, so global longest-river rankings are disputed."
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_LAKE_NAME="Lake Titicaca"
COM_KLUCONCOUNTRIES_FACT_SOUTH_AMERICA_LAKE_SCOPE="Largest freshwater lake by surface area in South America under the conventional definition excluding coastal lagoons such as Maracaibo. Surface area varies with water level."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_AREA_SCOPE="Regional land-area reference including Australia, New Zealand, Papua New Guinea and Pacific islands, excluding western New Guinea. This is not Pacific Ocean surface area."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_POPULATION_SCOPE="OWID aggregate from UN WPP 2024 for 2023. Statistical Oceania excludes Indonesia; it differs from a geological definition including all of New Guinea."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_HIGHEST_NAME="Puncak Jaya / Carstensz Pyramid"
COM_KLUCONCOUNTRIES_FACT_OCEANIA_HIGHEST_SCOPE="Physical Australasia including western New Guinea, Indonesia. This broader mountain convention differs from the area/population scope above; Mount Wilhelm is the highest in Papua New Guinea, while Kosciuszko is the mainland Australian high point."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_LOWEST_NAME="Kati Thanda-Lake Eyre"
COM_KLUCONCOUNTRIES_FACT_OCEANIA_LOWEST_SCOPE="Australia; approximate lake-bed elevation below sea level, not the water level during a flood."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_RIVER_NAME="Murray-Darling-Condamine river system"
COM_KLUCONCOUNTRIES_FACT_OCEANIA_RIVER_SCOPE="Longest continuous Australian river system under Geoscience Australia's 2008 mapped-channel calculation. The Murray alone is about 2,508 kilometres."
COM_KLUCONCOUNTRIES_FACT_OCEANIA_LAKE_NAME="Kati Thanda-Lake Eyre"
COM_KLUCONCOUNTRIES_FACT_OCEANIA_LAKE_SCOPE="Approximate maximum filled surface area of a usually dry or partly filled salt lake, not a permanent water surface."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_AREA_SCOPE="Approximate continental area including permanent ice; excludes the seasonally expanding sea-ice cover. Published values vary with ice-shelf and coastline treatment."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_POPULATION_SCOPE="Zero denotes no permanent native/resident population, not an uninhabited continent. Approximately 1,000 winter and 5,000 summer research/support personnel are a broad seasonal reference range, not a current station census. Density is not calculated from the permanent-population zero."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_HIGHEST_NAME="Mount Vinson"
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_HIGHEST_SCOPE="Ellsworth Mountains; 2004 GPS measurement reported by USGS."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_LOWEST_NAME="Deep Lake shoreline, Vestfold Hills"
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_LOWEST_SCOPE="Approximate accessible surface/shoreline depression. This is not the continent's deepest subglacial bedrock, which lies much farther below sea level."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_RIVER_NAME="Onyx River"
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_RIVER_SCOPE="Approximate length of a seasonal surface meltwater stream, excluding subglacial drainage systems."
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_LAKE_NAME="Lake Vostok"
COM_KLUCONCOUNTRIES_FACT_ANTARCTICA_LAKE_SCOPE="Approximate subglacial lake area cited by USGS; the lake is beneath the ice sheet rather than an exposed water surface. Published geometric estimates vary."
