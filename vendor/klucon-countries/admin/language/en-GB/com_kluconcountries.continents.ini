COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_OVERVIEW="Europe occupies the western part of Eurasia and has an extensively indented coastline."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_LOCATION="Northern Hemisphere, extending across the Eastern and Western Hemispheres."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_BOUNDARIES="The conventional boundary with Asia follows the Urals, Ural River, Caspian Sea, Caucasus and Black Sea straits. Continental boundaries are conventions, not national borders."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_OCEANS="Atlantic Ocean and Arctic Ocean; major adjacent seas include the Mediterranean, Baltic and Black Seas."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_TERRAIN="Major landscapes include the European Plain, Scandinavian uplands, Alps, Carpathians and extensive peninsulas."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_CLIMATE="Conditions range from Arctic and subarctic climates to temperate maritime, continental and Mediterranean climates."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_CLASSIFICATION="Europe and Asia are separate geographic groupings here, despite sharing the Eurasian landmass. Transcontinental countries can belong to both."
COM_KLUCONCOUNTRIES_CONTINENT_EUROPE_REGISTRY_NOTE="The count includes registered countries and territories, not only sovereign states. It is calculated from current registry memberships."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_OVERVIEW="Africa is the second-largest continent and extends across the Equator."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_LOCATION="Northern and Southern Hemispheres; the prime meridian also crosses the continent."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_BOUNDARIES="The Mediterranean separates Africa from Europe. The Red Sea and the Suez region mark its northeastern connection with Asia."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_OCEANS="Atlantic Ocean to the west and Indian Ocean to the east; the Mediterranean and Red Seas form important northern boundaries."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_TERRAIN="Major landscapes include the Sahara, Sahel, Congo Basin, East African Rift, Ethiopian Highlands and southern plateaus."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_CLIMATE="Climate zones include equatorial rainforest, tropical savanna, hot desert, highland and Mediterranean environments."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_CLASSIFICATION="Africa is a geographic continent, not an administrative parent or a political union. Egypt has African and Asian geographic memberships in this registry."
COM_KLUCONCOUNTRIES_CONTINENT_AFRICA_REGISTRY_NOTE="Country and territory memberships are counted together. Regional organizations and their membership totals are separate concepts."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_OVERVIEW="Asia is the largest continent and forms the eastern part of the Eurasian landmass."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_LOCATION="Predominantly in the Northern and Eastern Hemispheres, with islands extending south of the Equator."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_BOUNDARIES="Its western boundary with Europe is conventional. The Suez region connects it with Africa, and the Bering Strait separates it from North America."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_OCEANS="Arctic Ocean to the north, Pacific Ocean to the east and Indian Ocean to the south."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_TERRAIN="The Himalayas, Tibetan Plateau, Siberian plains, major river basins, deserts and island arcs illustrate its geographic diversity."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_CLIMATE="Climates range from polar and subarctic to continental, arid, monsoon and humid tropical conditions."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_CLASSIFICATION="A country may have multiple continental memberships. Geographic membership is independent of political or sporting affiliations."
COM_KLUCONCOUNTRIES_CONTINENT_ASIA_REGISTRY_NOTE="The count reflects registered countries and territories assigned to Asia, including transcontinental entries."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_OVERVIEW="North America extends from the Arctic to the Central American isthmus and includes the Caribbean geographic region."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_LOCATION="Predominantly in the Northern and Western Hemispheres."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_BOUNDARIES="The Bering Strait separates it from Asia. Central America connects it to South America at the Isthmus of Panama."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_OCEANS="Arctic Ocean to the north, Atlantic Ocean to the east and Pacific Ocean to the west."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_TERRAIN="The western cordilleras, Canadian Shield, interior plains, Appalachian Mountains and coastal lowlands form major physical regions."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_CLIMATE="Conditions range from Arctic and subarctic through temperate and arid zones to tropical Central American and Caribbean climates."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_CLASSIFICATION="This grouping includes Central America, the Caribbean and Greenland. It is broader than the statistical subregion called Northern America."
COM_KLUCONCOUNTRIES_CONTINENT_NORTH_AMERICA_REGISTRY_NOTE="Territories are classified geographically, not automatically under the continent of their administering state."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_OVERVIEW="South America extends from the Caribbean region toward the southern end of the Americas."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_LOCATION="Western Hemisphere, mostly south of the Equator, with northern areas in the Northern Hemisphere."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_BOUNDARIES="The Isthmus of Panama joins it to North America. The Drake Passage lies between its southern end and the Antarctic Peninsula."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_OCEANS="Pacific Ocean to the west and Atlantic Ocean to the east."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_TERRAIN="Principal landscapes include the Andes, Amazon Basin, Guiana and Brazilian highlands, Pampas and Patagonia."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_CLIMATE="Equatorial rainforest, tropical savanna, arid coastal, temperate, mountain and subpolar environments occur across the continent."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_CLASSIFICATION="South America is separate from North America in this registry's seven-group model. Latin America is a cultural grouping and is not synonymous with this continent."
COM_KLUCONCOUNTRIES_CONTINENT_SOUTH_AMERICA_REGISTRY_NOTE="The count includes countries and territories geographically assigned to South America, regardless of their administrative affiliation."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_OVERVIEW="Oceania is a broad geographic grouping comprising Australia and Pacific island regions."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_LOCATION="Pacific-centred region spanning both sides of the Equator and the international date line."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_BOUNDARIES="Its limits depend on the classification used; geographic, geological, statistical and sporting definitions do not always agree."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_OCEANS="Pacific Ocean and the Indian Ocean around western Australia."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_TERRAIN="Continental land, mountainous and volcanic islands, coral atolls, reefs and extensive marine environments characterize the region."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_CLIMATE="Environments range from arid Australian interiors to tropical islands, temperate New Zealand and alpine landscapes."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_CLASSIFICATION="Oceania is used here as a regional registry group. It is not identical to the geological continent of Australia. Melanesia, Micronesia and Polynesia are associated regional groupings."
COM_KLUCONCOUNTRIES_CONTINENT_OCEANIA_REGISTRY_NOTE="Country assignments follow the registry's geographic catalogue and can differ from sporting confederations. Ocean surface is not land area."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_OVERVIEW="Antarctica is the ice-covered continent surrounding the South Pole."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_LOCATION="Southern Hemisphere, largely south of the Antarctic Circle, spanning all longitudes."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_BOUNDARIES="The continental coastline, Antarctic region and Antarctic Treaty area are different geographic or legal concepts. The Treaty applies south of 60 degrees south latitude."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_OCEANS="Southern Ocean surrounds the continent."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_TERRAIN="A vast ice sheet covers most of the land, with mountain ranges, exposed rock, ice shelves and the Antarctic Peninsula."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_CLIMATE="Polar desert conditions predominate, with extreme cold, strong winds and seasonal daylight differences."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_CLASSIFICATION="Antarctica has no sovereign countries. Territorial claims do not constitute ordinary national subdivisions, and this registry does not adjudicate sovereignty."
COM_KLUCONCOUNTRIES_CONTINENT_ANTARCTICA_REGISTRY_NOTE="The count includes Antarctica and southern territories assigned to this catalogue group. It is not a count of sovereign countries or a statement that every entry lies on the continental mainland."
